{% extends "admin/base.html" %}
{% block title %}设置 · 加分管理{% endblock %}

{% block content %}
<header class="page-header">
    <h1 class="page-title">设置</h1>
</header>

<div class="card admin-card">
    <div class="card-body">
        <h2 class="h6">当前学期</h2>
        <p class="text-muted small">所有新上传的加分默认归入此学期；学生端默认查看此学期。</p>
        <form method="post" class="d-flex gap-2" style="max-width:480px;">
            <input class="form-control" name="semester" value="{{ current_sem }}" required>
            <button class="btn btn-primary">保存</button>
        </form>
        {% if semesters %}
        <div class="small text-muted mt-3">
            历史学期：
            {% for s in semesters %}
                <span class="badge bg-primary-soft text-primary me-1">{{ s }}</span>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
