{% extends "base.html" %}
{% block title %}管理员登录 · 活动加分系统{% endblock %}

{% block content %}
<div class="install-wrap">
    <div class="install-card shadow-sm">
        <div class="text-center mb-4">
            <div class="brand-badge">管理后台</div>
            <h1 class="h4 mt-3 mb-1">管理员登录</h1>
            <p class="text-muted small mb-0">学生端无需密码，本入口仅供管理员</p>
        </div>
        <form method="post" autocomplete="off">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">登录</button>
        </form>
        <div class="text-center mt-3">
            <a class="small text-muted" href="{{ url_for('student.login') }}">学生入口 →</a>
        </div>
    </div>
</div>
{% endblock %}
